name: Behind the Dots validation

on:
  push:
    branches:
      - fix/behind-dots-gameplay-and-layout
  pull_request:
    paths:
      - 'src/features/behind-the-dots/**'
      - 'tests/behind-the-dots-*.test.mts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/behind-the-dots-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Behind the Dots unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium for visual checks
        run: npx playwright install --with-deps chromium
      - name: Verify tutorial layout on desktop and mobile
        run: npx playwright test tests/e2e/behind-dots-tutorial-layout.spec.ts
      - name: Upload visual check screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behind-dots-visual-failure
          path: test-results/behind-dots/
          if-no-files-found: ignore
