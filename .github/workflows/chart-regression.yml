name: Validate chart regression
on:
  push:
    branches: [fix/desktop-challenge-chart-only]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  chart-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/behind-dots-chart-regression.spec.ts --project=desktop
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chart-regression-failure
          path: test-results/
          if-no-files-found: ignore
